name: Inventory receiver safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sqlserver:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      Jwt__Secret: 'SyntheticOnly_CrossProjectTrial_NotARealJwtSigningKey_123456789'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: mo7amed789/Pharmacy-App
          ref: '2176620fdcaa0920d04167988c51ecbb45b74bc0'
          path: publisher-app
      - name: Start isolated SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb create InventoryReceiverTests -s
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB setup failed' }
      - name: Test receiver transactions against SQL Server
        shell: pwsh
        env:
          INVENTORY_TEST_SQLSERVER: 'Server=(localdb)\InventoryReceiverTests;Database=InventoryReceiverSafety;Integrated Security=true;TrustServerCertificate=true'
        run: dotnet test tests/PharmacyAvailability.IntegrationTests --filter FullyQualifiedName~ReceiverSqlServerTests --logger "console;verbosity=normal"
      - name: Combined synthetic desktop to receiver to finder trial
        shell: pwsh
        env:
          INVENTORY_TEST_SQLSERVER: 'Server=(localdb)\InventoryReceiverTests;Database=InventoryCrossProjectTrial;Integrated Security=true;TrustServerCertificate=true'
          ConnectionStrings__DefaultConnection: 'Server=(localdb)\InventoryReceiverTests;Database=InventoryCrossProjectTrial;Integrated Security=true;TrustServerCertificate=true'
          Jwt__Secret: 'SyntheticOnly_CrossProjectTrial_NotARealJwtSigningKey_123456789'
          PHARMACY_APP_SOURCE: '${{ github.workspace }}\publisher-app'
          PUBLISHER_TRIAL_SCRIPT: '${{ github.workspace }}\tests\cross-project\publisher_trial.py'
        run: dotnet test tests/PharmacyAvailability.IntegrationTests --filter "FullyQualifiedName~CrossProjectTrialTests|FullyQualifiedName~MultiBranchCatalogTrialTests|FullyQualifiedName~SecurityRateLimitTests" --logger "console;verbosity=normal"
      - name: Audit runtime dependencies
        run: dotnet list src/PharmacyAvailability.Api package --vulnerable --include-transitive
      - name: Unit tests
        run: dotnet test tests/PharmacyAvailability.UnitTests
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/PharmacyAvailability.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/PharmacyAvailability.Web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
